name: Post-check keys

# Срабатывает, когда NL-сервер публикует свежий список из РФ (stage/result.txt).
# Проверяет ключи через xray и убирает из подписок умершие.

on:
  push:
    branches: [main]
    paths: ["stage/result.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keys
  cancel-in-progress: false

jobs:
  post-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
      - uses: actions/checkout@v4
        with:
          repository: megnar/vless-reality-checker
          ssh-key: ${{ secrets.CHECKER_SSH_KEY }}
          path: checker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: checker/bin
          key: xray-${{ hashFiles('checker/get_xray.py') }}
      - name: Get xray
        working-directory: checker
        run: test -x bin/xray || python get_xray.py
      - name: Post-check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        working-directory: checker
        run: python post_check.py --public ../public
      - name: Commit
        working-directory: public
        run: |
          git config user.name "Bounty VPN"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "✅ Постпроверка: убраны умершие ключи ($(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК)"
          git push
      - name: Alert
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_CHAT_ID}" \
            --data-urlencode "text=⚠️ Bounty ключи: постпроверка упала. ${RUN_URL}"
