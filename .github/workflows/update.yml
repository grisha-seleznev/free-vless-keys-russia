name: Update keys

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    paths: [sources.txt, update.py, README.template.md]

permissions:
  contents: write

concurrency:
  group: update-keys
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Commit
        run: |
          git config user.name "keys-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keys.txt sub.txt README.md
          git diff --cached --quiet && exit 0
          git commit -m "🔑 Обновление ключей $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
          git push
